[workspace]
resolver = "3"
members = ["crates/raytex-core", "crates/raytex-cli", "crates/raytex-desktop"]
default-members = ["crates/raytex-core", "crates/raytex-cli", "crates/raytex-desktop"]

[workspace.package]
version = "0.5.4"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ifanoxy/raytex"
homepage = "https://github.com/ifanoxy/raytex"
authors = ["The RayTeX contributors"]

[workspace.dependencies]
raytex-core = { path = "crates/raytex-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
thiserror = "2"
flate2 = "1"
sha2 = "0.10"
spellbook = "0.4"
encoding_rs = "0.8"
zip = { version = "4", default-features = false, features = ["deflate-flate2-zlib-rs"] }
regex = "1"
memchr = "2"
ignore = "0.4"
directories = "6"
dunce = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
ureq = "3"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-build = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
notify = "8"
trash = "5"
clap = { version = "4", features = ["derive"] }
svg2pdf = "0.13"
# Already built for svg2pdf with these formats: compressing images adds no code of others.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
# Small by default (the window, the web view, the network, the settings):
# the code that reads, checks and draws while you work stays fast below.
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.release.package.raytex-core]
opt-level = 3

[profile.release.package.spellbook]
opt-level = 3

[profile.release.package.regex]
opt-level = 3

[profile.release.package.regex-automata]
opt-level = 3

[profile.release.package.regex-syntax]
opt-level = 3

[profile.release.package.aho-corasick]
opt-level = 3

[profile.release.package.memchr]
opt-level = 3

[profile.release.package.image]
opt-level = 3

[profile.release.package.zune-jpeg]
opt-level = 3

[profile.release.package.zune-core]
opt-level = 3

[profile.release.package.png]
opt-level = 3

[profile.release.package.fdeflate]
opt-level = 3

[profile.release.package.miniz_oxide]
opt-level = 3

[profile.release.package.zlib-rs]
opt-level = 3

[profile.release.package.flate2]
opt-level = 3

[profile.release.package.crc32fast]
opt-level = 3

[profile.release.package.simd-adler32]
opt-level = 3

[profile.release.package.adler2]
opt-level = 3

[profile.release.package.weezl]
opt-level = 3

[profile.release.package.tiny-skia]
opt-level = 3

[profile.release.package.tiny-skia-path]
opt-level = 3

[profile.release.package.encoding_rs]
opt-level = 3

[profile.release.package.serde_json]
opt-level = 3

# Fast, debuggable dev builds but optimized dependencies (the PDF / regex heavy
# code paths are otherwise painfully slow in debug).
[profile.dev.package."*"]
opt-level = 2
