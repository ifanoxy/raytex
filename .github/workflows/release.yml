name: Release

# A tag v* builds the installers of every system into a draft release.
# Signing turns itself on when its secrets are set (docs/SIGNING.md):
# - macOS: Developer ID signature and Apple notarization (APPLE_* secrets);
# - Windows: signature by SignPath (SIGNPATH_* variables and secret).
# Every release also gets SHA256SUMS.txt and a build provenance attestation
# (`gh attestation verify FILE --repo OWNER/raytex`), and, when the update key
# is set (TAURI_SIGNING_PRIVATE_KEY), the signed update files and latest.json
# that the application reads to offer the new version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.name }})
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (Apple silicon)
            os: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS (Intel)
            os: macos-latest
            args: --target x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            args: ""
          - name: Windows
            os: windows-latest
            args: ""
    runs-on: ${{ matrix.os }}
    env:
      HAS_APPLE: ${{ secrets.APPLE_CERTIFICATE != '' }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies of Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev
      # Without the secrets, the application keeps its ad-hoc signature.
      - name: Apple signature and notarization
        if: runner.os == 'macOS' && env.HAS_APPLE == 'true'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          ID: ${{ secrets.APPLE_ID }}
          PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          {
            echo "APPLE_CERTIFICATE<<RAYTEX_EOF"
            echo "$CERTIFICATE"
            echo "RAYTEX_EOF"
            echo "APPLE_CERTIFICATE_PASSWORD=$CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY"
            echo "APPLE_ID=$ID"
            echo "APPLE_PASSWORD=$PASSWORD"
            echo "APPLE_TEAM_ID=$TEAM_ID"
            echo "KEYCHAIN_PASSWORD=$(openssl rand -hex 16)"
          } >> "$GITHUB_ENV"
          # The identity replaces the ad-hoc one ("-") of tauri.conf.json.
          node -e 'const fs = require("fs"); const f = "crates/raytex-desktop/tauri.conf.json"; const c = JSON.parse(fs.readFileSync(f, "utf8")); c.bundle.macOS.signingIdentity = process.env.SIGNING_IDENTITY; fs.writeFileSync(f, JSON.stringify(c, null, 2));'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Update files (.sig, latest.json) signed with the project's key.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: crates/raytex-desktop
          tagName: ${{ github.ref_name }}
          releaseName: RayTeX ${{ github.ref_name }}
          releaseBody: See CHANGELOG.md for the changes of this version.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }} ${{ env.HAS_UPDATER_KEY == 'true' && format('--config {0}/crates/raytex-desktop/tauri.updater.conf.json', github.workspace) || '' }}

  # SignPath (free for open-source projects) signs the Windows installers;
  # the signed files replace the unsigned ones in the draft release.
  sign-windows:
    name: Windows signature (SignPath)
    needs: build
    if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
      HAS_UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
    steps:
      - name: Unsigned Windows installers
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir unsigned --pattern '*.exe' --pattern '*.msi'
      - id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: windows-unsigned
          path: unsigned/
      - uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'raytex' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
      - name: Signed installers in the release
        run: gh release upload "$TAG" signed/* --repo "$GITHUB_REPOSITORY" --clobber
      # The update signatures were made on the unsigned files: made again on
      # the signed ones, and written into latest.json.
      - name: Update signatures of the signed installers
        if: env.HAS_UPDATER_KEY == 'true'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for f in signed/*; do npx --yes @tauri-apps/cli@2 signer sign "$f"; done
          gh release upload "$TAG" signed/*.sig --repo "$GITHUB_REPOSITORY" --clobber
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern latest.json --dir . || exit 0
          node -e '
            const fs = require("fs");
            const latest = JSON.parse(fs.readFileSync("latest.json", "utf8"));
            for (const p of Object.values(latest.platforms)) {
              const file = "signed/" + decodeURIComponent(p.url.split("/").pop());
              if (fs.existsSync(file + ".sig")) p.signature = fs.readFileSync(file + ".sig", "utf8").trim();
            }
            fs.writeFileSync("latest.json", JSON.stringify(latest, null, 2));
          '
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber

  # Once the files are final: their fingerprints, and the proof that they
  # were built here from this source.
  checksums:
    name: Checksums and provenance
    needs: [build, sign-windows]
    if: ${{ always() && needs.build.result == 'success' && (needs.sign-windows.result == 'success' || needs.sign-windows.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Files of the release
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir files
          rm -f files/SHA256SUMS.txt
          cd files && sha256sum -- * > ../SHA256SUMS.txt && cat ../SHA256SUMS.txt
      - name: SHA256SUMS.txt in the release
        run: gh release upload "$TAG" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
      # Attestations need a public repository (or GitHub Enterprise).
      - name: Build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: files/*
