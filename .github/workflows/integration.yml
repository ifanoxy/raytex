name: Integration

# Builds with a real TeX distribution (TeX Live, on Linux and on Windows).
# A run in progress is never cancelled by a new push: the newest push waits
# for it (only the latest waiting run is kept), so these tests always finish.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  tex:
    name: Integration tests with TeX Live
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: TeX Live and Linux dependencies of Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-lang-french texlive-lang-cyrillic texlive-science texlive-pictures texlive-bibtex-extra texlive-fonts-extra texlive-luatex texlive-xetex fonts-lmodern biber latexmk lmodern \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev
          # LuaLaTeX finds the OpenType fonts through its own database.
          luaotfload-tool --update --force
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Engine tests needing TeX
        run: cargo test -p raytex-core --release -- --ignored --skip ctan

  # Windows, with TeX Live: installed with every package the tests need
  # before they run, and kept in the cache.
  windows-engine:
    name: Integration tests on Windows (TeX Live)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: TeX Live
        uses: TeX-Live/setup-texlive-action@v4
        with:
          package-file: .github/texlive-packages.txt
      - name: Fonts of LuaLaTeX
        run: luaotfload-tool --update --force
      # RayTeX's command lines in a folder with a space and an accent, like
      # C:\Users\Jean Dupont\Documents: a build (root file relative to the
      # working directory) and a preview (absolute path of the file).
      - name: Compilation in a folder with a space and an accent
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "Projet de thèse"
          New-Item -ItemType Directory -Force (Join-Path $dir "build") | Out-Null
          Set-Content -Path (Join-Path $dir "smoke.tex") -Value '\documentclass{article}\begin{document}Hello\end{document}'
          Set-Location $dir
          pdflatex -synctex=1 -interaction=nonstopmode -file-line-error "-output-directory=$dir\build" smoke.tex
          Write-Output "build, exit code: $LASTEXITCODE"
          if (Test-Path build\smoke.pdf) { Write-Output "build: PDF written" } else { Write-Output "build: no PDF" }
          pdflatex -interaction=nonstopmode -halt-on-error -file-line-error "-output-directory=$dir\build" "$dir\smoke.tex"
          Write-Output "preview, exit code: $LASTEXITCODE"
          Get-ChildItem build | Format-Table Name, Length
          exit 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Engine tests needing TeX
        run: cargo test -p raytex-core --release -- --ignored --skip ctan --nocapture

  # The application itself on Windows: the scenes of ui/dev/selftest.ts
  # (scripts/e2e.mjs), with a screenshot at each step; same distribution
  # as above.
  windows-app:
    name: Application on Windows (end to end, TeX Live)
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: TeX Live
        uses: TeX-Live/setup-texlive-action@v4
        with:
          package-file: .github/texlive-packages.txt
      - name: Fonts of LuaLaTeX
        run: luaotfload-tool --update --force
      - uses: dtolnay/rust-toolchain@stable
      # Kept even when a scene fails: without it, every run compiles the
      # application from scratch (about 25 minutes).
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Scenes of the application
        # The runner's session is not interactive: without these, WebView2
        # takes the window for hidden and stops drawing (no PDF, no preview).
        env:
          WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: --disable-features=CalculateNativeWinOcclusion --disable-renderer-backgrounding --disable-background-timer-throttling --disable-backgrounding-occluded-windows
        run: node scripts/e2e.mjs workflow fixes files projects media
      - name: Scenes of the built application
        # The built application reads its pages under the security policy
        # of tauri.conf.json, which the development one does not have: a
        # style the policy refuses (0.4.0) is only seen here.
        env:
          WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS: --disable-features=CalculateNativeWinOcclusion --disable-renderer-backgrounding --disable-background-timer-throttling --disable-backgrounding-occluded-windows
          E2E_BUILT: 1
          E2E_OUT: e2e-output/built
        run: node scripts/e2e.mjs workflow
      - name: Logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-app-texlive
          path: e2e-output/
          retention-days: 14

  # Installers for Windows (MSI and NSIS), to download from the run.
  windows-installers:
    name: Windows installers
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run app:build
      - uses: actions/upload-artifact@v4
        with:
          name: raytex-windows-installers
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
          retention-days: 30
