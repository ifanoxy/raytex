name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  interface:
    name: Interface (svelte-check, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Windows cannot create files named CON, PRN, AUX, NUL, COM1…, LPT1…
      # (even with an extension), nor names with < > : " | ? * or a final dot.
      - name: File names valid on Windows
        run: |
          bad=$(git ls-files -z | tr '\0/' '\n\n' | grep -iE '^(con|prn|aux|nul|com[1-9]|lpt[1-9])(\..*)?$|[<>:"|?*]|[. ]$' || true)
          if [ -n "$bad" ]; then echo "Names Windows refuses: $bad"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      - name: Website
        run: node site/build.mjs

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies of Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The desktop crate embeds the built interface.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace
