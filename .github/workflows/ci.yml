name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  interface:
    name: Interface (svelte-check, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Windows cannot create files named CON, PRN, AUX, NUL, COM1…, LPT1…
      # (even with an extension), nor names with < > : " | ? * or a final dot.
      - name: File names valid on Windows
        run: |
          bad=$(git ls-files | tr '/' '\n' | grep -iE '^(con|prn|aux|nul|com[1-9]|lpt[1-9])(\..*)?$|[<>:"|?*]|[. ]$' || true)
          if [ -n "$bad" ]; then echo "Names Windows refuses: $bad"; exit 1; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux dependencies of Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # The desktop crate embeds the built interface.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

  tex:
    name: Integration tests with TeX Live
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: TeX Live and Linux dependencies of Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-lang-french texlive-lang-cyrillic texlive-science texlive-pictures texlive-bibtex-extra texlive-fonts-extra texlive-luatex texlive-xetex fonts-lmodern biber latexmk lmodern \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev
          # LuaLaTeX finds the OpenType fonts through its own database.
          luaotfload-tool --update --force
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Engine tests needing TeX
        run: cargo test -p raytex-core --release -- --ignored --skip ctan

  miktex:
    name: Integration tests with MiKTeX (Windows)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: MiKTeX (packages installed on the fly)
        shell: pwsh
        run: |
          choco install miktex --no-progress -y
          $bin = "C:\Program Files\MiKTeX\miktex\bin\x64"
          if (-not (Test-Path "$bin\pdflatex.exe")) { Get-ChildItem -Recurse -Filter pdflatex.exe "C:\Program Files" | Select-Object -First 3 | Format-List FullName; exit 1 }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          & "$bin\initexmf.exe" --admin --set-config-value="[MPM]AutoInstall=1"
          & "$bin\initexmf.exe" --set-config-value="[MPM]AutoInstall=1"
          & "$bin\miktex.exe" --admin packages update-package-database
          & "$bin\initexmf.exe" --admin --update-fndb
          & "$bin\pdflatex.exe" --version
      - name: First compilation with MiKTeX, shown in full
        shell: pwsh
        run: |
          Set-Content -Path smoke.tex -Value '\documentclass{article}\begin{document}Hello\end{document}'
          pdflatex -interaction=nonstopmode --enable-installer smoke.tex
          Write-Output "exit code: $LASTEXITCODE"
          if (Test-Path smoke.log) { Get-Content smoke.log -Tail 40 } else { Write-Output "no log" }
          if (Test-Path smoke.pdf) { Write-Output "PDF written" } else { Write-Output "no PDF" }
      # RayTeX's command lines in a folder with a space and an accent, like
      # C:\Users\Jean Dupont\Documents: a build (root file relative to the
      # working directory) and a preview (absolute path of the file).
      - name: Compilation in a folder with a space and an accent
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "Projet de thèse"
          New-Item -ItemType Directory -Force (Join-Path $dir "build") | Out-Null
          Copy-Item smoke.tex $dir
          Set-Location $dir
          $env:BIBINPUTS = "$dir;"
          pdflatex --enable-installer -synctex=1 -interaction=nonstopmode -file-line-error "-output-directory=$dir\build" smoke.tex
          Write-Output "build, exit code: $LASTEXITCODE"
          if (Test-Path build\smoke.pdf) { Write-Output "build: PDF written" } else { Write-Output "build: no PDF" }
          pdflatex --enable-installer -interaction=nonstopmode -halt-on-error -file-line-error "-output-directory=$dir\build" "$dir\smoke.tex"
          Write-Output "preview, exit code: $LASTEXITCODE"
          Get-ChildItem build | Format-Table Name, Length
          exit 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # One test at a time: two compilations installing the same package
      # at once make one of them fail (MiKTeX locks its package database).
      - name: Engine tests needing TeX
        run: cargo test -p raytex-core --release -- --ignored --skip ctan --nocapture --test-threads=1
